name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: closeup
          POSTGRES_PASSWORD: closeup
          POSTGRES_DB: closeup
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U closeup -d closeup"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://closeup:closeup@localhost:5432/closeup
      REDIS_URL: redis://localhost:6379
      CLOSEUP_TEST_INFRA: '1'
      TEST_DATABASE_URL: postgresql://closeup:closeup@localhost:5432/closeup
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:all
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm --filter @closeup/api prisma:deploy
      - run: pnpm -r test
