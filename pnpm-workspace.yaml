packages:
  - apps/*
  - packages/*

# pnpm >= 11 refuses to run dependency build scripts unless they are listed here
# (the older `onlyBuiltDependencies` key is silently ignored).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  prisma: true
  '@prisma/engines': true
  # Optional native speed-up for BullMQ's msgpackr, which works fine in pure JS.
  msgpackr-extract: false
  # Pulled in by @tensorflow/tfjs. Its install script only prints a funding banner.
  core-js: false

# Supply-chain guard: never resolve to a version published less than a day ago (minutes).
# Keep dependency ranges loose enough (`^x.y.0`) for pnpm to fall back to the previous release
# instead of adding per-package exclusions here.
minimumReleaseAge: 1440
